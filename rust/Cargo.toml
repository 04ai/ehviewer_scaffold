[package]
name = "ehviewer_rust_backend"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
tokio = { version = "1.37", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25"
webp = "0.3"
scraper = "0.19"
lru = "0.12"
anyhow = "1.0"
md5 = "0.7"
lazy_static = "1.4"
futures = "0.3"
log = "0.4"
urlencoding = "2.1.3"
jni = { version = "0.21", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
