[package]
name = "ehviewer_rust_backend"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[lints.rust]
# flutter_rust_bridge 2.x macros emit cfg(frb_expand); acknowledge it so
# `cargo check` doesn't spam unexpected_cfgs warnings.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }

[dependencies]
flutter_rust_bridge = "=2.12.0"
tokio = { version = "1.37", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25"
webp = "0.3"
scraper = "0.19"
lru = "0.12"
anyhow = "1.0"
md5 = "0.7"
lazy_static = "1.4"
futures = "0.3"
log = "0.4"
urlencoding = "2.1.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
